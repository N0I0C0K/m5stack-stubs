name: Build & publish stubs

# On a published GitHub Release: regenerate the stubs from the firmware C source,
# validate and build the `m5stack-stubs` package, and publish it to PyPI.
on:
  release:
    types: [published]
  workflow_dispatch:           # manual run -> builds only, never publishes
    inputs:
      ref:
        description: "uiflow-micropython git ref to generate from"
        default: "master"

permissions:
  contents: read
  id-token: write              # required for PyPI Trusted Publishing (OIDC)

env:
  # Manual runs only build; release events publish using PyPI Trusted Publishing.
  PUBLISH_TO_PYPI: "true"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Generate stubs from the firmware C source (no device)
        run: |
          uv run m5stubgen fetch --ref "${{ github.event.inputs.ref || 'master' }}"
          uv run m5stubgen gen
          uv run m5stubgen gen --out stubpkg

      - name: Validate bindings and generated return types
        run: |
          uv run python tests/test_bindings.py
          uv run python tests/verify_distribution.py stubpkg/M5.pyi
          uvx pyright

      - name: Set package version from the release tag
        if: github.event_name == 'release'
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "stub package version = $VER"
          sed -i "s/^version = .*/version = \"${VER}\"/" stubpkg/pyproject.toml

      - name: Build sdist + wheel
        run: uv build stubpkg --out-dir dist

      - name: Validate packaged stub
        run: uv run python tests/verify_distribution.py dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        if: github.event_name == 'release' && env.PUBLISH_TO_PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

[project]
name = "m5stubgen"
version = "0.1.0"
description = "Generate Pylance/pyright type stubs for M5Stack UIFlow2 MicroPython firmware"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "N0I0C0K" }]
keywords = ["m5stack", "uiflow", "micropython", "stubs", "pyi", "pylance", "type-stubs"]
dependencies = []

[project.optional-dependencies]
# only needed for the `dump` subcommand (talking to a board)
device = ["mpremote>=1.20"]

[project.scripts]
m5stubgen = "m5stubgen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["m5stubgen"]

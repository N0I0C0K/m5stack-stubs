name: Build & publish stubs

# On a published GitHub Release: regenerate the stubs from the firmware C source,
# build the `m5stack-stubs` package, and (once configured) publish it to PyPI.
on:
  release:
    types: [published]
  workflow_dispatch:           # manual run -> builds artifact only, never publishes
    inputs:
      ref:
        description: "uiflow-micropython git ref to generate from"
        default: "master"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Generate stubs from the firmware C source (no device)
        run: |
          uv run m5stubgen fetch --ref "${{ github.event.inputs.ref || 'master' }}"
          uv run m5stubgen gen --out stubpkg

      - name: Validate generated stub parses
        run: python -c "import ast; ast.parse(open('stubpkg/M5.pyi', encoding='utf-8').read()); print('M5.pyi OK')"

      - name: Set package version from the release tag
        if: github.event_name == 'release'
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "stub package version = $VER"
          sed -i "s/^version = .*/version = \"${VER}\"/" stubpkg/pyproject.toml

      - name: Build sdist + wheel
        run: uv build stubpkg --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Publishes only on a real release AND once you opt in. Until then this job is
    # skipped, so releases never fail. To enable:
    #   1. On PyPI, set up Trusted Publishing for project `m5stack-stubs`
    #      (publisher = this repo, workflow = release.yml, environment = pypi).
    #   2. Create a GitHub environment named `pypi`.
    #   3. Set repository variable PUBLISH_TO_PYPI = true.
    # No API token / secret is stored — publishing uses OIDC (Trusted Publishing).
    if: github.event_name == 'release' && vars.PUBLISH_TO_PYPI == 'true'
    environment: pypi
    permissions:
      id-token: write          # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
